[package]
name = "scrcpyt"
version = "0.1.0"
edition = "2024"
description = "Mirror and control an Android device inside a terminal, powered by scrcpy-server"
license = "Apache-2.0"
repository = "https://github.com/leset0ng/scrcpyt"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
libc = "0.2"

[profile.release]
lto = "thin"
